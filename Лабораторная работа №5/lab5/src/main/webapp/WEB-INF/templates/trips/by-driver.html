<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Рейсы по водителю</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" href="../../../css/style.css"/>
</head>
<body>
<header>
    <h1>Рейсы по водителю</h1>
</header>
<main>
    <section>
        <form class="styled" method="get" th:action="@{/welcome/trips/by-driver}">
            <label>
                ID водителя
                <input type="number" name="driverId" min="1" th:value="${driverId}" placeholder="например, 1"/>
            </label>
            <button type="submit">Найти</button>
        </form>

        <p th:if="${searchError}" class="error" th:text="${searchError}">Ошибка</p>

        <div th:if="${searched}">
            <p th:if="${#lists.isEmpty(trips)}" class="empty">У водителя нет рейсов.</p>
            <table th:unless="${#lists.isEmpty(trips)}">
                <tr>
                    <th>ID рейса</th>
                    <th>Маршрут</th>
                    <th>Заказчик</th>
                    <th>Автомобиль</th>
                    <th>Статус</th>
                    <th>Отправление</th>
                </tr>
                <tr th:each="t : ${trips}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.request.route.cityFrom} + ' — ' + ${t.request.route.cityTo}">Минск — Брест</td>
                    <td th:text="${t.request.customer.name}">ООО</td>
                    <td th:text="${t.car != null} ? ${t.car.plateNumber} : '—'">—</td>
                    <td th:text="${t.status}">PLANNED</td>
                    <td th:text="${t.departureDate}">2026-10-15</td>
                </tr>
            </table>
        </div>

        <a class="back" th:href="@{/}" href="../../../index.html">На главную</a>
    </section>
</main>
<footer>
    <p th:if="${visits != null}">
        Посещений: <span th:text="${visits}">1</span>,
        предыдущий визит: <span th:text="${lastVisit}">—</span>
    </p>
</footer>
</body>
</html>
