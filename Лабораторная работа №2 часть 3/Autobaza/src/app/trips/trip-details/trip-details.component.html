@if (trip(); as currentTrip) {
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Детали рейса</h5>
      <hr>
      <p><strong>ID:</strong> {{ currentTrip.id }}</p>
      <p><strong>Описание:</strong> {{ currentTrip.description }}</p>
      <p><strong>Водитель:</strong> {{ currentTrip.driver }}</p>
      <a
        [routerLink]="['/addTrip', currentTrip.id]"
        class="btn btn-outline-primary btn-sm"
      >
        Редактировать в форме
      </a>
    </div>
  </div>
}
