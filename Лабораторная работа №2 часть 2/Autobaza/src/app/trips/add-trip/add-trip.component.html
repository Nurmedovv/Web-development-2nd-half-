<div class="container">
  <h1 class="mb-4">Форма рейса</h1>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group mb-3">
      <label for="tripId">Id</label>
      <input
        id="tripId"
        type="number"
        class="form-control"
        [value]="tripId()"
        #idInput
        (input)="tripId.set(+idInput.value)"
      >
    </div>

    <div class="form-group mb-3">
      <label for="tripDescription">Описание</label>
      <input
        id="tripDescription"
        type="text"
        class="form-control"
        [value]="tripDescription()"
        #descriptionInput
        (input)="tripDescription.set(descriptionInput.value)"
      >
    </div>

    <div class="form-group mb-3">
      <label for="tripDriver">Водитель</label>
      <input
        id="tripDriver"
        type="text"
        class="form-control"
        [value]="tripDriver()"
        #driverInput
        (input)="tripDriver.set(driverInput.value)"
        list="drivers-list"
        placeholder="Введите или выберите водителя"
      >
      <datalist id="drivers-list">
        @for (driver of drivers(); track driver) {
          <option [value]="driver"></option>
        }
      </datalist>
    </div>

    <label class="mb-3 d-block">
      <input
        type="checkbox"
        [checked]="isEditing()"
        #editingInput
        (change)="isEditing.set(editingInput.checked)"
      >
      Режим редактирования
    </label>

    <button
      type="submit"
      class="btn btn-primary me-2"
      [disabled]="!formValid()"
    >
      {{ isEditing() ? 'Обновить' : 'Добавить' }}
    </button>

    <button
      type="button"
      class="btn btn-danger me-2"
      [disabled]="!isEditing() || !formValid()"
      (click)="onDelete()"
    >
      Удалить
    </button>

    <button
      type="button"
      class="btn btn-secondary"
      (click)="gotoTripList()"
    >
      Назад к списку
    </button>
  </form>
</div>
